name: Wunsch / Feature request
description: Eine Idee, was Hedgie zusätzlich können sollte. / An idea for something new.
labels: ["Wunsch"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Was wünschst du dir? / What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Wofür brauchst du es? / What do you need it for?
      description: Ein konkretes Beispiel hilft, die beste Lösung zu finden.
