[package]
name = "vorleser"
version = "0.5.7"
edition = "2021"
description = "Kleines Tray-Tool, das markierten Text mit den Windows-Stimmen vorliest"
authors = ["Florian Beubl, beseco – Beubl IT Systems <info@beseco.com>"]
homepage = "https://beseco.com"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Beseco/beseco-vorleser"

[dependencies]
# Entpackt DOCX, ODT und EPUB (reines Rust, ohne weitere Abhängigkeiten außer adler2).
miniz_oxide = "0.9"
# Punkte für Direct2D (kommt ohnehin mit dem windows-Crate).
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Speech",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
